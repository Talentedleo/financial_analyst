# Financial Analyst Configuration
# Note: Google ADK calls MiniMax directly via LiteLlm

model:
  name: MiniMax-M2.7-highspeed
  api_base: https://api.minimax.io/v1

# API Keys (set via environment variables or .env file)
# MINIMAX_API_KEY
# FINNHUB_API_KEY

# Session settings
session:
  # In production, use Redis for session storage
  storage: memory  # memory | redis

# CORS settings (for production)
cors:
  allow_origins:
    - "*"  # Configure appropriately
  allow_credentials: true

# Security (for production)
security:
  # API key authentication (implement in middleware for production)
  enabled: false
  master_key: sk-1234  # Change this in production
